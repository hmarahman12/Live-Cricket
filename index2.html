<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>7 Days Remaining Timer</title>
  <style>
    :root {
      --bg: #0b0b10;
      --card: #14161d;
      --text: #e7ecf3;
      --muted: #94a3b8;
      --accent: #4f46e5;
      --ring: #22d3ee;
      --ok: #10b981;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(1200px 800px at 20% 10%, #0f1120 0%, var(--bg) 50%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 28px 24px 22px;
      backdrop-filter: blur(6px);
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title {
      font-size: clamp(18px, 2.6vw, 28px);
      font-weight: 700;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--ring);
      box-shadow: 0 0 18px var(--ring);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    .muted { color: var(--muted); font-size: 14px; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px; 
      margin-top: 18px;
    }
    .unit {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px 14px;
      text-align: center;
    }
    .value {
      font-variant-numeric: tabular-nums;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
    }
    .label {
      margin-top: 6px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
    }
    .progress {
      margin-top: 18px;
      height: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--ring));
      box-shadow: 0 0 20px rgba(79,70,229,0.5);
      transition: width 0.9s ease;
    }
    .foot {
      margin-top: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .controls { display: flex; gap: 10px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); font-weight: 700;
      padding: 10px 14px; border-radius: 12px;
    }
    button:active { transform: translateY(1px); }
    .small { font-size: 12px; color: var(--muted); }
    .done {
      margin-top: 12px; font-weight: 700; color: var(--ok); display: none;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="card" id="timerCard" aria-live="polite">
    <div class="head">
      <div class="title"><span class="dot" aria-hidden="true"></span> 7 Days Free Trial</div>
      <div class="muted" id="deadlineText">Target: <span></span></div>
    </div>

    <div class="grid" role="group" aria-label="Countdown time blocks">
      <div class="unit" aria-label="Days left"><div class="value" id="days">0</div><div class="label">Days</div></div>
      <div class="unit" aria-label="Hours left"><div class="value" id="hours">0</div><div class="label">Hours</div></div>
      <div class="unit" aria-label="Minutes left"><div class="value" id="mins">0</div><div class="label">Minutes</div></div>
      <div class="unit" aria-label="Seconds left"><div class="value" id="secs">0</div><div class="label">Seconds</div></div>
    </div>

    <div class="progress" aria-label="Overall progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="done" id="doneMsg">Time's up! ✅</div>
  </div>




  <script>
    (function () {
      const STORAGE_KEY = '7_DayCountdownEnd';
      const TOTAL_MS = 2 * 24 * 60 * 60 * 1000; // 7 days

      const $ = (id) => document.getElementById(id);
      const daysEl = $('days');
      const hoursEl = $('hours');
      const minsEl = $('mins');
      const secsEl = $('secs');
      const barEl = $('bar');
      const deadlineSpan = document.querySelector('#deadlineText span');
      const doneMsg = $('doneMsg');

      let end = Number(localStorage.getItem(STORAGE_KEY));
      let start = Number(localStorage.getItem(STORAGE_KEY + ':start'));
      let paused = false;
      let pauseOffset = 0; // how much time is remaining when paused
      let rafId = null;

      function fmtDate(ts) {
        const d = new Date(ts);
        return d.toLocaleString(undefined, {
          year: 'numeric', month: 'short', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }

      function init() {
        const now = Date.now();
        if (!end || end <= now) {
          start = now;
          end = now + TOTAL_MS;
          localStorage.setItem(STORAGE_KEY, String(end));
          localStorage.setItem(STORAGE_KEY + ':start', String(start));
        }
        deadlineSpan.textContent = fmtDate(end);
        tick();
      }

      function setDisplay(msLeft) {
        const totalSeconds = Math.max(0, Math.floor(msLeft / 1000));
        const d = Math.floor(totalSeconds / 86400);
        const h = Math.floor((totalSeconds % 86400) / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        daysEl.textContent = d;
        hoursEl.textContent = String(h).padStart(2, '0');
        minsEl.textContent = String(m).padStart(2, '0');
        secsEl.textContent = String(s).padStart(2, '0');

        const elapsed = Math.min(TOTAL_MS, Math.max(0, (Date.now() - start)));
        const pct = (elapsed / TOTAL_MS) * 100;
        barEl.style.width = pct.toFixed(2) + '%';
      }

      function loop() {
        if (paused) return;
        const now = Date.now();
        const msLeft = end - now;
        setDisplay(msLeft);
        if (msLeft <= 0) {
          cancelAnimationFrame(rafId);
          doneMsg.style.display = 'block';
          barEl.style.width = '100%';
          return;
        }
        rafId = requestAnimationFrame(loop);
      }

      function tick() {
        cancelAnimationFrame(rafId);
        doneMsg.style.display = 'none';
        loop();
      }

      // Kick it off
      init();
    })();
  </script>
</body>
</html>
